<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sổ ghi — Hôm Nay Ăn Gì</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
body{margin:0;background:#FFF4D6}
a{color:#B71C1C}a:hover{color:#7F1010}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #1F5FD1;outline-offset:2px}
input[type=range]{accent-color:#C62828}
.hn-shell{max-width:1280px;margin:0 auto;padding:16px clamp(16px,3vw,32px) 32px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:16px 20px;align-items:start}
.hn-head{grid-column:1 / -1}
.hn-title,.hn-main{grid-column:1;min-width:0}
.hn-rail{grid-column:2;grid-row:2 / span 2;position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.hn-rail a{width:60px;height:60px;box-sizing:border-box;border:3px solid #1B1B1B;box-shadow:4px 4px 0 #1B1B1B;display:flex;align-items:center;justify-content:center;text-decoration:none}
.hn-rail a:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #1B1B1B}
@media (max-width:760px){
.hn-shell{grid-template-columns:minmax(0,1fr);padding-bottom:96px}
.hn-rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;flex-direction:row;justify-content:space-around;background:#C62828;border-top:4px solid #1B1B1B;padding:8px 10px}
.hn-rail a{width:52px;height:52px;box-shadow:3px 3px 0 #1B1B1B}
}
</style>
</helmet>
<div style="background: #FFF4D6; color: #1B1B1B; font-family: 'Be Vietnam Pro', sans-serif; min-height: 100vh">
<div class="hn-shell">

<header class="hn-head" style="background: #C62828; border: 4px solid #1B1B1B; box-shadow: 6px 6px 0 #1B1B1B; padding: 10px 16px; display: flex; align-items: center; gap: 12px">
<a href="ViaHe-Ban.dc.html" style="font-family: Bungee, sans-serif; font-size: clamp(24px, 3vw, 34px); line-height: 1; color: #FFCF33; text-shadow: 3px 3px 0 #1B1B1B; text-decoration: none; margin-right: auto">HÔM NAY ĂN GÌ</a>
<button aria-label="Minh, Chủ xị" title="Minh · Chủ xị" style="width: 44px; height: 44px; border-radius: 50%; background: #FFCF33; color: #1B1B1B; border: 3px solid #1B1B1B; display: flex; align-items: center; justify-content: center; font-family: 'Be Vietnam Pro', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">M</button>
</header>

<section class="hn-title" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; background: #1B1B1B; color: #FFF4D6; padding: 4px 10px">THÁNG 11 · {{countAll}} BÀN · {{sumAll}}</span>
<h1 style="margin: 0; font-family: Bungee, sans-serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 52px); line-height: 1; color: #FFCF33; -webkit-text-stroke: 2px #1B1B1B; text-shadow: 4px 4px 0 #C62828; transform: rotate(-2deg); transform-origin: left center">ĂN XONG LÀ XONG!</h1>
</section>

<nav class="hn-rail" aria-label="Chuyển màn">
<a href="ViaHe-Ban.dc.html" aria-label="Bàn hôm nay" title="Bàn hôm nay" style="background: #FFFFFF; color: #1B1B1B"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M13 3l-3 6M19 4l-6 5"></path></svg></a>
<a href="ViaHe-VongQuay.dc.html" aria-label="Vòng quay" title="Vòng quay" style="background: #FFFFFF; color: #1B1B1B"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path><circle cx="12" cy="12" r="2.5" fill="currentColor"></circle></svg></a>
<a href="ViaHe-TinhTien.dc.html" aria-label="Tính tiền" title="Tính tiền" style="background: #C62828; color: #FFFFFF"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></a>
<a href="ViaHe-SoGhi.dc.html" aria-current="page" aria-label="Sổ ghi" title="Sổ ghi" style="background: #FFCF33; color: #1B1B1B"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"></path><path d="M5 17a2 2 0 0 1 2-2h12M9 7h6M9 11h4"></path></svg></a>
<a href="ViaHe-KhoQuan.dc.html" aria-label="Kho quán" title="Kho quán" style="background: #FFFFFF; color: #1B1B1B"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5"></path><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"></path><path d="M5 12v9h14v-9M10 21v-5h4v5"></path></svg></a>
</nav>

<main class="hn-main">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="d" hint-placeholder-count="6">
<li style="background: #FFFFFF; border: 3px solid #1B1B1B; box-shadow: 4px 4px 0 #1B1B1B">
<button onClick="{{d.toggle}}" aria-expanded="{{d.openAttr}}" style="width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; text-align: left; background: transparent; color: #1B1B1B; border: 0; padding: 10px 14px; min-height: 56px; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; background: #1B1B1B; color: #FFF4D6; padding: 2px 8px">#{{d.no}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px">{{d.date}}</span>
<span style="font-family: Bungee, sans-serif; font-size: 17px; flex: 1 1 200px; min-width: 0">{{d.shop}}</span>
<span style="font-size: 14px; font-weight: 700">{{d.people}} người</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; min-width: 6.5em; text-align: right">{{d.total}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1B1B1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{d.rot}})"><path d="M9 5l7 7-7 7"></path></svg>
</button>
<sc-if value="{{d.open}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 2px dashed #1B1B1B; padding: 8px 14px 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{d.lines}}" as="l" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: minmax(0, 10em) 1fr auto; gap: 10px"><b style="font-family: 'Be Vietnam Pro', sans-serif">{{l.who}}</b><span>{{l.what}}</span><span style="font-weight: 700">{{l.amt}}</span></div>
</sc-for>
<button style="align-self: flex-start; margin-top: 6px; font-family: Bungee, sans-serif; font-size: 13px; background: #FFCF33; color: #1B1B1B; border: 3px solid #1B1B1B; box-shadow: 3px 3px 0 #1B1B1B; padding: 6px 12px; min-height: 44px; cursor: pointer">KÊ LẠI BÀN NÀY</button>
</div>
</sc-if>
</li>
</sc-for>
</ol>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 12 };
}
renderVals() {
const fmt = (n) => n.toLocaleString('vi-VN') + 'đ';
const data = [
{ no: 12, date: '10/11', shop: 'Cơm Tấm Cô Ba', people: 6, total: 340000, lines: [['Minh', 'Sườn bì chả + Ốp la', 66000], ['Lan HR', 'Sườn, ít cơm', 45500], ['Tuấn Dev', 'Ba rọi quay + Trà tắc', 61000], ['Hương Kế Toán', 'Đùi gà', 50500], ['Hoàng Design', 'Sườn + Canh khổ qua', 60500], ['Thảo Marketing', 'Cơm chay', 56500]] },
{ no: 11, date: '09/11', shop: 'Trà Sữa Nhà Mây', people: 3, total: 102000, lines: [['Thảo Marketing', 'Trà sữa oolong', 34000], ['Lan HR', 'Hồng trà', 34000], ['Hoàng Design', 'Trà đào', 34000]] },
{ no: 10, date: '09/11', shop: 'Cơm Tấm Cô Ba', people: 5, total: 310000, lines: [] },
{ no: 9, date: '08/11', shop: 'Bún Đậu Hàng Khay', people: 4, total: 241000, lines: [] },
{ no: 8, date: '07/11', shop: 'Trà Sữa Nhà Mây', people: 3, total: 128000, lines: [] },
{ no: 7, date: '06/11', shop: 'Bánh Mì Cô Hai', people: 6, total: 210000, lines: [] },
{ no: 6, date: '05/11', shop: 'Cơm Tấm Cô Ba', people: 5, total: 280000, lines: [] }
];
const rows = data.map((d) => {
const open = this.state.open === d.no;
return {
no: d.no, date: d.date, shop: d.shop, people: d.people, total: fmt(d.total),
open: open, openAttr: open ? 'true' : 'false', rot: open ? '90deg' : '0deg',
lines: d.lines.map((l) => ({ who: l[0], what: l[1], amt: fmt(l[2]) })),
toggle: () => this.setState({ open: open ? 0 : d.no })
};
});
return {
rows: rows,
countAll: data.length,
sumAll: fmt(data.reduce((s, d) => s + d.total, 0))
};
}
}
</script>
</body>
</html>
